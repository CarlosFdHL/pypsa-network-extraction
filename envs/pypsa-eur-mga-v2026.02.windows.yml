# Windows version of the Sophia environment pypsa-eur-mga-v2026.02 (exported 2026-11-26).
#
# Same versions as on Sophia for every package that was explicitly installed, plus the main
# Python libraries used for analysis. Low-level C libraries are left to conda to resolve for
# Windows: their Linux builds (envs/pypsa-eur-mga-v2026.02.linux-nobuilds.yml) do not exist on
# Windows. PyPSA is the fork CarlosFdHL/PyPSA-aleks, branch mga-extra-functionality, at the
# exact commit installed (editable) on Sophia.
#
# Snakemake and its plugins are left out: they come from bioconda (Linux only) and the workflow
# runs on Sophia, not locally.
#
# Create:  mamba env create -f envs/pypsa-eur-mga-v2026.02.windows.yml
name: pypsa-eur-mga-v2026.02
channels:
  - conda-forge
  - gurobi
dependencies:
  - python=3.12.13
  - pip=26.0.1
  # explicitly installed on Sophia (conda env export --from-history), at the Sophia versions
  - atlite=0.4.1
  - bokeh=3.9.0
  - cartopy=0.25.0
  - copernicusmarine=2.3.0
  - country_converter=1.3.2
  - dask=2026.1.2
  - descartes=1.1.0
  - entsoe-py=0.7.11
  - fiona=1.10.1
  - folium=0.20.0
  - geojson=3.2.0
  - geopandas=1.1.3
  - geopy=2.4.1
  - glpk=5.0
  - graphviz=14.1.2
  - grpcio=1.73.1
  - gurobi=12.0.3
  - highspy=1.13.1
  - ipython=9.11.0
  - jpype1=1.6.0
  - jupyter=1.1.1
  - libgdal-netcdf=3.12.2
  - linopy=0.6.5
  - lxml=6.0.2
  - matplotlib=3.10.8
  - memory_profiler=0.61.0
  - natsort=8.4.0
  - netcdf4=1.7.3
  - networkx=3.6.1
  - numpy=2.4.2
  - openpyxl=3.1.5
