# Settings for the extraction on Sophia. Run with: ./extract.sh  (or: sbatch extract.sh)
# Everything the extractor does is decided here; there are no command-line options.
#
# Typical use:
#   1. Extract a whole sweep at standard detail (one entry with only the run name).
#   2. Later, for a deeper analysis, add an entry for the same run with detail: full and the
#      scenarios/networks you need. Only those networks are opened, and only the missing
#      datasets are read. Then run sync.bat locally to download the new files.

# Folder with the PyPSA-Eur results (contains one folder per run)
results_root: ~/projects/pypsa-eur-aleks/results

# Where the extracted data is written (relative paths are relative to this repo)
data_dir: data

# Runs to extract. Per entry:
#   name:       run folder in results_root
#   scenarios:  all (default) or a list of scenario folder names
#   networks:   all (default) or a list of network names: design, val_wy<year>_<res> (e.g. val_wy1962_3H)
#   detail:     light, standard (default) or full (each level includes the previous ones)
#   datasets:   optional, exact list of datasets instead of a detail level (smallest download)
#   roles:      optional, overrides the global roles below
#   price_carriers: optional, overrides the global price_carriers below
runs:
  # Design-grid study (notebooks/nyears_nseg_grid.ipynb): only what the notebook reads.
  # design: capacities.csv and buses.csv (scenario level) and the capacity check of the validations
  - name: nyears_nseg_sweep2
    networks: [design, val_wy1962_3H, val_wy1965_3H, val_wy1996_3H]
    datasets: [buses, capacities, summary, energy_totals]

  # Runs of the other notebooks, not extracted yet: move them above this line when needed
  # Multi-year designs validated on other weather years
  # (year_order_effect, load_shedding_ranking, resilience_multi_year_opt_new)
  # - name: multi_year_greedy
  # - {name: multi_year_anti_greedy, detail: light, price_carriers: [AC, co2 atmosphere]}
  # - {name: multi_year_fixed_res_per_year_shuffled2, detail: light, price_carriers: [AC, co2 atmosphere]}
  # Single-year 3H designs, reference of the segmentation study and baselines
  # (system_cost_design_years, single_year_seg_dem_*, resilience_multi_year_opt_new)
  # - {name: yearly_3H, detail: light, price_carriers: [AC, co2 atmosphere]}
  # Price-guided segmentation (single_year_seg_dem_new, single_year_seg_dem_all_years)
  # - {name: yearly_1460seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_1095seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_876seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_730seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_626seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_548seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_487seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_438seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_398seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_365seg, detail: light, price_carriers: [AC]}
  # - {name: yearly_337seg, detail: light, price_carriers: [AC]}
  # Input-based segmentation
  # - {name: yearly_1460seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_1095seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_876seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_730seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_626seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_548seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_487seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_438seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_398seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_365seg_input, detail: light, price_carriers: [AC]}
  # - {name: yearly_337seg_input, detail: light, price_carriers: [AC]}

  # Example of a later, detailed extraction of a few networks:
  # - name: multi_year_greedy
  #   scenarios: [weather_years_1958_1941_1252seg]
  #   networks: [design, val_wy1962_3H]
  #   detail: full

# Which networks of each scenario: design, validation or both (default for every run entry)
roles: [design, validation]

# Datasets of each detail level. Levels are cumulative in this order
# (standard = light + standard, full = light + standard + full).
# Each name is an extractor in src/network_extraction/datasets/.
detail_levels:
  light:                     # sweeps with many networks (design studies, segmentation)
    - snapshots              # weightings and weather year
    - buses                  # scenario level: carrier, location, country, x, y
    - capacities             # scenario level: every asset of the design network
    - summary                # capex, opex, shedding cost/energy/peak, VOLL, objective, net CO2
    - global_constraints
    - prices                 # nodal prices of price_carriers (can be set per run)
    - ac_load                # electricity demand at the AC buses
    - energy_totals          # supply/withdrawal over the horizon by (component, bus_carrier, carrier)
    - marginal_costs         # validation networks: static marginal costs
    - solver_stats           # rows, columns, solve time, memory (solver log and benchmark)
  standard:
    - shedding               # load-shedding dispatch per generator (validation networks)
    - generation_by_carrier
    - availability_by_carrier
    - link_p0_by_carrier
    - link_p1_by_carrier
    - link_p2_by_carrier
    - link_p3_by_carrier
    - link_p4_by_carrier
    - store_e_by_carrier
    - store_p_by_carrier
    - storage_unit_p_by_carrier
    - storage_unit_soc_by_carrier
    - load_by_carrier
    - supply_by_carrier      # statistics.supply by (bus_carrier, carrier)
    - withdrawal_by_carrier  # statistics.withdrawal by (bus_carrier, carrier)
  full:
    - generation             # per asset
    - availability           # time-varying p_max_pu per generator
    - link_p0
    - link_p1
    - link_p2
    - link_p3
    - link_p4
    - store_e
    - store_p
    - storage_unit_p
    - storage_unit_soc
    - line_p0
    - load

# Extract again even if the files are up to date:
#   false            only missing or outdated datasets
#   true             every dataset
#   [shedding, ...]  only these datasets (in the networks selected by runs)
force: false

# File format of time series (parquet or csv). Static tables are always csv.
timeseries_format: parquet

# Network file names inside <run>/<scenario>/networks/
design_pattern: '^base_s_.+\.nc$'
validation_pattern: '^weather_year_(?P<weather_year>\d{4})_(?P<resolution>[^_]+)_base_s_.+\.nc$'

# Run configs copied to data/<run>/config/ (globs relative to results/<run>/)
run_config_globs: ['configs/*.yaml', '*/configs/*.yaml']

# Load-shedding generator carriers by type
shedding_carriers:
  electricity: elec load
  heat: heat shed

# Shedding dispatch below this value [MW] is stored as 0 (solver noise; keeps shedding.parquet small)
shedding_zero_tol: 1.0e-3

# Bus carriers whose marginal prices are stored in prices.parquet
price_carriers: [AC, low voltage, urban central heat, urban decentral heat]

# Relative tolerance of the consistency checks
check_rtol: 1.0e-4
