[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "network-extraction"
version = "0.1.0"
description = "Extract reduced data from solved PyPSA-Eur networks for the multi-year resilience paper"
requires-python = ">=3.10"
dependencies = ["pypsa", "pandas>=2.0", "numpy", "pyarrow", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "highspy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
